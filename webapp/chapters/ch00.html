# 导论与全书鸟瞰（Introduction & High-Level Overview）

> 译自 Hugging Face nanotron 团队《The Ultra-Scale Playbook: Training LLMs on GPU Clusters》（Nouamane Tazi 等人著，Apache 2.0），原文为 [Hugging Face Space](https://huggingface.co/spaces/nanotron/ultrascale-playbook)。

**《The Ultra-Scale Playbook: Training LLMs on GPU Clusters》**（超大规模训练手册：在 GPU 集群上训练大语言模型）

> 🔬 原文此处为交互图表（书名页横幅）：我们使用最多 512 张 GPU 运行了 4,000 多次规模化实验，并测量吞吐量（throughput，以标记大小表示）和 GPU 使用率（以标记颜色表示）。图中的两项指标均已按模型大小归一化。可前往[原网页](https://huggingface.co/spaces/nanotron/ultrascale-playbook)体验。

数千张 GPU 协同运行，像一场由算力奏响的交响乐——训练当今最强大的 AI 模型，正需要这样的场景。直到不久前，这仍是顶尖研究实验室的专属能力。开源改善了这一局面，却还没有解决全部问题。如今，你可以下载最新的 [Llama](https://huggingface.co/meta-llama) 或 [DeepSeek](https://huggingface.co/deepseek-ai) 模型，也可以阅读相应的[技术报告](https://ai.meta.com/research/publications/the-llama-3-herd-of-models/)和[实验报告](https://github.com/deepseek-ai/DeepSeek-R1/blob/main/DeepSeek_R1.pdf)。但最具挑战性的部分——训练代码，以及协调大量 GPU 训练这些庞大模型所需的知识和技术——依然复杂难懂，散落在彼此割裂的论文和大量未公开的代码库中。

> 阅读时间：2–4 天。为获得最佳阅读体验，建议不要使用手机阅读。

这本开源书籍正是为了改变这一现状。我们将从基础讲起，逐步介绍如何把大语言模型（Large Language Model, LLM）的训练从单张 GPU 扩展到数十、数百乃至数千张 GPU，并用实用的代码示例和可复现的基准测试（benchmark）验证相关理论。

随着训练集群的规模不断增长，人们提出了多种技术——包括数据并行（Data Parallelism, DP）、张量并行（Tensor Parallelism, TP）、流水线并行（Pipeline Parallelism, PP）、上下文并行（Context Parallelism, CP）、ZeRO 和内核融合（kernel fusion）——以尽量提高 GPU 使用率。这些技术不仅大幅缩短了训练时间，也让昂贵的硬件得到更充分的利用。扩展 AI 训练的挑战也不只存在于预训练阶段：人们发现，在特定领域的数据上微调（fine-tuning）大模型往往效果最佳，而这通常也需要相同的分布式训练技术。本书将由浅入深地介绍这些技术，并沿着一条清晰的主线说明每种方法的来龙去脉。

> 如果你有任何问题或意见，欢迎到[社区讨论区（Community tab）](https://huggingface.co/spaces/nanotron/ultrascale-playbook/discussions?status=open&type=discussion)开一个讨论！

我们假设你对当前的 LLM 架构已有一些基本认识，也大致熟悉深度学习模型的训练方式；即使你刚接触分布式训练，也可以从这里开始。如有需要，可以通过 [DeepLearning.ai](https://www.deeplearning.ai) 的优质课程或 [PyTorch 教学](https://pytorch.org/tutorials/beginner/basics/intro.html)补充模型训练的基础知识。本书可视为三部曲的第二部，承接第一篇讨论预训练数据处理的“[FineWeb 博客文章](https://huggingface.co/spaces/HuggingFaceFW/blogpost-fineweb-v1)”。读完这两篇后，你就掌握了理解现代高性能 LLM 构建方式所需的大部分核心知识；再补上数据混配（data mixing）和架构选择，整个知识拼图就完整了（敬请期待第三部……）。

> 我们由衷感谢整个 [distill.pub](https://distill.pub/) 团队打造了本文所依据的版面模板。

**清楚的代码实现：** 理论是一回事，但当我们实际动手实现时，才会发现各式各样的边界情况（edge case）与重要细节。因此我们会尽可能附上实现参考链接。视情况而定，我们会使用两套参考代码：

* [picotron](https://github.com/huggingface/picotron) 是一个教学型代码库，通常会用独立且自包含的短文件实现每个概念。

* 若要参考生产级（production-ready）代码，我们会引用 [nanotron](https://github.com/huggingface/nanotron) 的实现——这是 Hugging Face 实际使用的训练代码库。

> 如果比起阅读本书或 picotron 的代码，你更想通过视频学习分布式训练，可以看看 [Ferdinand 的 YouTube 频道](https://www.youtube.com/watch?v=u2VSwDDpaBM&list=PL-_armZiJvAnhcRr6yTJ0__f3Oi-LLi9S)。

**真实的训练效率基准测试：** 最后，如何*实际*扩展 LLM 的训练规模，取决于具体的基础设施——例如芯片类型和互连（interconnect）方式——因此不存在一套普遍适用的方案。我们能提供的是一套评测不同配置的方法，而这正是我们在自己的集群上做的事！我们完成了 4,100 多次分布式实验（若计入测试运行则超过 16,000 次），最多使用 512 张 GPU，覆盖了大量分布式训练布局和模型规模。

如你所见，本书涵盖的内容相当广泛。在深入分布式训练的细节之前，我们先从全局视角了解即将面对的各项挑战。

## 全局概览（High-Level Overview）

本书涵盖的所有技术，都是在解决以下三大关键挑战中的一项或多项；这些挑战也会在全书中反复出现：

1. **内存占用（memory usage）**：这是一项硬性限制——如果一个训练步骤（training step）无法装入内存，训练就无法进行。
2. **计算效率（compute efficiency）**：我们希望硬件把大部分时间用于计算，因此必须减少数据传输和等待其他 GPU 完成工作的时间。
3. **通信开销（communication overhead）**：我们希望尽量降低通信开销，因为通信会让 GPU 闲置。为此，需要充分利用节点内（intra-node，较快）和节点间（inter-node，较慢）的带宽，并尽可能让通信与计算重叠（overlap）。

在后面的章节中，我们会反复看到计算、通信和内存之间的取舍，例如重计算（recomputation）和张量并行。找到合适的平衡点，正是扩展训练规模的关键。
