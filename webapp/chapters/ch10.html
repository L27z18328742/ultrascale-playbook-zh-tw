# 第 10 章　融合内核、Flash Attention 与混合精度（Fused Kernels, Flash Attention & Mixed Precision）

> 译自 Hugging Face nanotron 团队《The Ultra-Scale Playbook: Training LLMs on GPU Clusters》（Apache 2.0），原文为 [Hugging Face Space](https://huggingface.co/spaces/nanotron/ultrascale-playbook)。本章为原书“Diving in the GPUs”后半。

## 融合内核（Fused Kernels）

我们已经在许多地方提过，GPU 与 CPU 的运算可以是异步的。特别是，CPU 上的主机（host）代码可以用非阻塞（non-blocking）的方式，把工作负载调度到 GPU 上。

非阻塞执行非常适合重叠通信与计算，前面的章节已经多次使用这一点。它还引出一个更普遍的原则：尽量减少主机与 GPU 内核（kernel）之间的往返调度。

[Horace He](https://horace.io/brrr_intro.html) 用下面几张图直观地展示了这个思路：

![一连串内核在全局内存与计算单元之间来回搬移](../webapp/assets/images/fused_kernels1.png)

*一连串内核的运行，需要在全局内存与计算单元之间来回搬移数据*

![融合内核一次完成所有运算](../webapp/assets/images/fused_kernels2.png)

*与其把中间结果写回全局内存后再读取，不如一次完成所有计算。*

要避免数据反复传输，就应让 GPU 尽可能连续执行。具体做法是把多个连续计算操作合并到一个内核中，这就是所谓的“融合内核”（fused kernel）。

对于一连串彼此独立地作用于每个输入 token 的逐元素（pointwise）运算，内核融合既高效又易于实现。在这种情况下，没有必要把中间结果写回全局内存，再读入 SM 并启动新内核。将这些值保留在本地，直到整串计算完成，效率会高得多。

Transformer 模型中的许多地方都可以使用内核融合（kernel fusion），尤其是一连串逐元素运算，例如层归一化（layer norm）中的计算。

有了这些基础，接下来介绍内核工程中最重要的成果之一：**Flash Attention**。

## Flash Attention 1-3

Flash Attention 由 [Tri Dao](https://tridao.me) 提出，通过编写自定义 CUDA 内核来优化注意力计算，让它更快*而且*更节省内存。Flash Attention 背后的想法，是有效利用 GPU 的各种内存，避免过度依赖其中最慢的一种：GPU 的全局内存。

> 📝 **注**：GPU 的全局内存有个容易让人混淆的名字——“高带宽内存”（High Bandwidth Memory, HBM）🫠

注意力机制的基本实现需要在内存与计算单元之间传输大量数据。它必须将 $S$ 矩阵和 $P$ 矩阵物化（materialize）到 HBM 中，也就是先把计算结果写入 HBM，再读回 SRAM 继续计算：

![朴素注意力实现在 HBM 与 SRAM 之间的数据搬移](../webapp/assets/images/flashattn.png)

由于 HBM 的带宽低得多，这在注意力计算中造成了严重的瓶颈。我们能做得更好吗？Tri Dao 说：可以！

关键是将 $S$ 矩阵分块计算，使每个小块都能装入 SM 上容量较小的共享内存。还可以更进一步：完全避免物化庞大的 $S$ 矩阵，只保留计算 softmax 归一化因子所需的统计量。这样，就能直接在 SRAM 中计算 $O$ 的一部分，无需来回传输中间结果。这既充分利用了共享内存，也消除了一个重要的内存瓶颈：在长上下文场景下，注意力矩阵是模型中最大的激活矩阵之一。

![Flash Attention 分块计算示意图](../webapp/assets/images/flashattn2.png)

*图片来源：FlashAttention 论文*

Flash Attention 解决了模型训练中的多个瓶颈，因此迅速成为 Transformer 计算注意力的默认方式：

* 通过避免物化 $S$ 矩阵，**降低注意力的内存开销**
* 我们也**大幅消除了注意力 $O(S^2)$ 成本在朴素实现下的影响**

因此，许多线性注意力（linear attention）变体和亚二次（sub-quadratic）复杂度的近似注意力方法逐渐淡出主流，取而代之的是既精确又快速的 Flash Attention。

继 Flash Attention 1 之后，同一实验室又发布了 Flash Attention 2 和 3。后两个版本主要针对 GPU 优化底层实现，而不是修改注意力机制本身：Flash Attention 2 尽量减少非矩阵乘法（non-matmul）运算，并在 warp 和线程块（thread block）之间更合理地分配工作；Flash Attention 3 则针对 Hopper（H100）架构的 FP8 和 Tensor Core 进行了优化。

> 📝 **注**：Flash Attention 对哪些注意力模式能被加速有一些限制。可以看看 [FlexAttention](https://pytorch.org/blog/flexattention/)，它是一个既快速*又*有弹性的变体。

Flash Attention 充分说明：针对 GPU 内部的内存和计算结构进行设计，可以带来数量级显著的性能改进。

---

到目前为止，本节（运算融合）所描述的技术，都需要我们修改建模代码，并为特定运算编写自定义内核，才能加速训练。

本章最后介绍一类与具体模型代码无关的方法。它们适用于各种模型，并已成为业界标准：**混合精度训练（Mixed Precision Training）**。

## 混合精度训练（Mixed Precision Training）

在本书的多个章节里，我们谈过各种低精度格式，以及它们对存储激活值、参数与优化器状态所需内存的影响。现在是时候深入这些格式的细节，更透彻地理解它们的取舍、优点与限制了。

混合精度训练，顾名思义，就是在训练时混合使用不同的精度。PyTorch 张量的默认数值精度是单精度浮点数格式（single-precision floating point format），也称为 FP32 或 float32，意思是每个存储的数字占 32 比特，也就是 4 个字节。用来表示一个数字的比特被分成三个部分：

* 符号（sign）：第一个比特，决定数字是正还是负
* 尾数（mantissa）：决定数字的有效位数
* 指数（exponent）：控制数字的数量级

![浮点数的符号、尾数与指数位配置](../webapp/assets/images/sign-mantissa-exponent.svg)

可以用科学记数法直观理解浮点数，例如 $-5.734 \times 10^{7}$：最前面是符号，之后分别是尾数和指数。这种表示方法可以用自适应精度覆盖很大的数量级范围。除了默认的 float32，PyTorch 还支持多种浮点格式：

| **格式** | **总比特数** | **符号** | **指数** | **尾数** |
|---|---|---|---|---|
| float32 | 32 | 1 | 8 | 23 |
| float16 | 16 | 1 | 5 | 10 |
| bfloat16 | 16 | 1 | 8 | 7 |
| float8 (e4m3) | 8 | 1 | 4 | 3 |
| float8 (e5m2) | 8 | 1 | 5 | 2 |

> 📝 **注**：你可能会好奇 bfloat16 里的“b”是哪来的。这个格式是在 Google Brain 开发出来的，所以“b”代表的是“brain”。

减少总比特数是要付出代价的（这里同样没有白吃的午餐），但我们对于怎么付这个代价有一些掌控权：可以多牺牲一些尾数的比特，也可以多牺牲一些指数的比特。正因如此，float8 才存在两种以指数与尾数命名的格式，让我们能弹性选择最合适的一种。我们可以看看每种格式所能表示的数值范围：

![各浮点格式可表示的数值范围](../webapp/assets/images/mixedprecision.png)

可以看到，float32 横跨了 80 个数量级；float16 牺牲了大量的范围，而 bfloat16 则保有完整的范围。两种 float8 格式把范围缩得更小：e5m2 还能维持 float16 的范围，e4m3 的范围则更小。

为什么有些格式能维持范围，有些却不行？让我们通过分辨率来一探究竟：在 1 到 2 之间取 10,000 个点，并把每个点四舍五入到各格式中最接近的可表示数字：

![各浮点格式在 1 到 2 区间的分辨率比较](../webapp/assets/images/mixedprecision_2.png)

从这里可以看到，bfloat16 虽然维持了 float32 的范围（优于 float16），却是以牺牲更多精度为代价。至于 float8，情况更加严峻：在 1 到 2 的区间里，e4m3 只能表示 7 个数字，e5m2 更只有 3 个。

衡量浮点格式分辨率的常用指标是 epsilon，即 $1.00$ 与下一个可表示数字之间的差值。对于 float32，$10^{-4}$ 是一个上界（实际值为 $1.19 \times 10^{-7}$）；float16 约为 $10^{-3}$，bfloat16 则又高一个数量级。

混合精度训练的想法，就是在维持全精度训练效果的同时，改用其中一些较低精度的格式。

事实证明，我们**不能**完全抛弃 float32，通常仍需要让某些部分维持在全精度。这也是为什么低精度训练通常被称为**混合精度**训练。

现在，让我们先看看如何用 16 比特训练模型，再看看能不能更进一步，一路降到 8 比特。

### FP16 与 BF16 训练

直接把所有张量和计算都改为 float16 通常行不通，往往会导致损失发散。早期混合精度训练论文提出了三项技巧，使其达到 float32 训练的效果：

1. **FP32 权重副本**：float16 权重有两个可能的问题。训练过程中，有些权重可能变得非常小，以致被舍入为 0。然而，即使权重本身离零不算近，只要更新量非常小，两者数量级的差距也可能导致权重在加法过程中发生下溢（underflow）。权重一旦变成 0，由于再也没有梯度信号传过来，它在之后的训练中就会一直维持是 0。
2. **损失缩放（loss scaling）**：梯度也有类似的问题，因为梯度往往远小于 1，因此有下溢的风险。一个简单却有效的策略是：在反向传播之前先缩放损失，并在反向传播之后把梯度的缩放还原（unscale）。这确保了反向传播过程中不会发生下溢；而由于我们会在进一步处理梯度（例如裁剪）与运行优化步骤之前先还原缩放，这个缩放并不会影响训练。
3. **累加（accumulation）**：最后，以 16 比特精度运行某些算术运算（例如取平均或求和）时，同样可能遇到下溢或上溢（overflow）。解法是在运算过程中以 float32 累加中间结果，只在最后才把结果转回 16 比特精度。

借助这些技巧，训练既能保持稳定，也能从更快的低精度算术中获得更高吞吐量。下一步自然是继续降低精度：能否从 16 比特进一步降到 8 比特？

### FP8 预训练

即使我们把通信与计算重叠得天衣无缝，最终还是会撞上硬件本身底层的理论 FLOPS 上限，也就是硬件上每一个个别运算的效率。这正是数值精度变得至关重要的地方。举例来说，在 NVIDIA 的 H100 GPU 上，FP8 矩阵乘法（GEMM 运算）的理论 FLOPS 是 bfloat16 的两倍，这使得低精度训练成为进一步优化的一条诱人途径。

近期的研究——包括 FP8-LM、torchao 与 DeepSeek-V3——已经展示了 FP8 训练在大规模模型上的潜力。尽管如此，FP8 预训练仍带来一个重大挑战：稳定性。在较低的精度下，数值不稳定常常导致损失发散，难以追平较高精度训练的准确度。

我们知道，在模型大小固定的情况下，不稳定性会随着学习率提高而增加，这让 FP8 预训练格外棘手。

以下是 FP8 训练典型发散损失曲线的一个例子：

![FP8 训练的发散损失曲线](../webapp/assets/images/fp8_training_loss_curves.svg)

> 🔬 原文此处为交互图表（可缩放查看不同 FP8 训练设置下损失曲线的发散情况），可前往[原网页](https://huggingface.co/spaces/nanotron/ultrascale-playbook)体验。

第一个公开报告以 FP8 混合精度成功完成超大规模训练的，是 DeepSeek-V3。作者仔细分析了前向传播（Fprop）的每一个运算，以及反向传播中的激活值梯度（Dgrad）与权重梯度（Wgrad）运算。与 BF16 混合精度训练类似，部分聚合运算与主权重（master weights）以较高精度保存，而运算本身则以 FP8 运行。

![DeepSeek-V3 的 FP8 混合精度训练流程图](../webapp/assets/images/fp8_diagram.png)

为了从高精度（例如 FP32 或 BF16）切换到范围较小的低精度（例如 FP16 或 FP8），我们需要对激活值的范围做归一化，例如计算它们的绝对最大值。DeepSeek-V3 进一步引入了一种特定的量化方案：以小块（tile）为单位对范围做归一化——输入／激活值采 $1 \times 128$、权重与缩放元素采 $128 \times 128$。这让归一化比较不会受到激活值中离群值的强烈影响。他们还提出了许多能进一步降低内存与通信开销的技巧，你可以在 DeepSeek-V3 技术报告的 3.3 节中继续深入。

以下汇总几种已知的 FP8 训练做法：

| 方案 | GEMM 精度 | 主模型权重 | 累积梯度 | 模型权重 | 梯度 | 优化器状态 | 总内存 |
|---|---|---|---|---|---|---|---|
| bfloat16 搭配 fp32 的混合精度基准 | bf16 | fp32 | fp32 | bf16 | bf16 | fp32 + fp32 | 4 + 4 + 2 + 2 + 4 + 4 = 20 字节 |
| 同上，但不做 FP32 梯度累积 | bf16 | fp32 | n/a | bf16 | bf16 | fp32 + fp32 | 4 + 2 + 2 + 4 + 4 = 16 字节 |
| Transformer Engine | fp8 | n/a | n/a | fp32 | fp32 | fp32 + fp32 | 4 + 4 + 4 + 4 = 16 字节（减少 20%） |
| FP8-LM 的 O3 等级 | fp8 | fp16 | fp16 | fp8 | fp8 | fp8 + fp16 | 2 + 2 + 1 + 1 + 1 + 2 = 9 字节（减少 55%） |
| DeepSeek-V3 | fp8 | fp32 | fp32 | fp8 | bf16 | bf16 + bf16 | 4 + 4 + 1 + 2 + 2 + 2 = 15（减少 25%） |
| nanotron 的 FP8 | fp8 | bf16 | fp32 | fp8 | fp8 | fp8 + fp8 | 2 + 4 + 1 + 1 + 1 + 1 = 10 字节（减少 50%） |

整体而言，FP8（在 2025 年初）仍是一项实验性技术，各种方法仍在持续演进。鉴于它显而易见的好处，它很可能成为标准，并在不久之后取代 bf16 混合精度。想跟踪 FP8 训练技术的开源实现，请前往 nanotron 在[这个 PR](https://github.com/huggingface/nanotron/pull/70) 中的实现。

再往更远的未来看，NVIDIA 的下一代芯片 Blackwell [已经宣布](https://www.nvidia.com/en-us/data-center/technologies/blackwell-architecture/)将支持 FP4 训练，能进一步加速训练，但毫无疑问，也会带来新的训练稳定性挑战。

---

至此，我们完成了从数十张到数千张 GPU 上高效训练大模型的技术介绍。下一章将对全书内容进行总结。
