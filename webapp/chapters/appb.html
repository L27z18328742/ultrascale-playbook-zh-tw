# 附录 A1　分布式训练性能分析（Distributed Training Profiling）

> 译自 Hugging Face nanotron 团队《The Ultra-Scale Playbook: Training LLMs on GPU Clusters》（Apache 2.0），原文为 [Hugging Face Space](https://huggingface.co/spaces/nanotron/ultrascale-playbook)。

## Kernel

先假设要分析的内核（kernel）已经集成到 PyTorch 中。以 `torch.nn.functional.layer_norm` 实现的层归一化（layer normalization）为例，有多种方法可以分析其底层内核的性能。最直接的方法是使用 Python 的 `time` 模块，但 CUDA 操作采用异步执行，因此这种测量只能捕捉 Python 端启动内核的开销，无法得到内核本身的实际运行时间。

为解决这个问题，可以使用 `torch.cuda.Event` 精确计时，并调用 `torch.cuda.synchronize()`，确保程序等待内核运行完毕。示例代码如下：

```python
def profile_pytorch(func, input):
    # 创建 CUDA event 来跟踪时间。CUDA 操作是异步的。
    start = torch.cuda.Event(enable_timing=True)  # 标记开始时间的 event
    end = torch.cuda.Event(enable_timing=True)    # 标记结束时间的 event
    # 先暖身（warm up），消除第一次运行带来的额外开销，
    # 因为那可能无法反映实际性能
    for _ in range(10):
        func(input)
    # 在运行目标函数之前记录开始时间
    start.record()
    func(input)  # 调用我们要分析的函数
    # 在函数运行完成后记录结束时间
    end.record()
    # 同步 CUDA 操作，确保所有操作都已完成，
    # 再测量经过的时间
    torch.cuda.synchronize()
    # 计算并返回经过的时间（毫秒）
    return start.elapsed_time(end)
```

更高效的分析方式，是使用前文介绍过的 PyTorch profiler。例如，看看以下这段代码：

```python
import torch
import torch.nn.functional as F

def pytorch_layer_norm(input):
    return F.layer_norm(input, input.size()[1:])

a = torch.randn(10000, 10000).cuda()

with torch.profiler.profile(
    activities=[
        torch.profiler.ProfilerActivity.CPU,   # 分析 CPU 活动
        torch.profiler.ProfilerActivity.CUDA,  # 分析 CUDA 活动
    ],
    # 定义 profiler 的调度
    schedule=torch.profiler.schedule(
        wait=1,      # 先等待 1 个迭代再开始分析
        warmup=3,    # 暖身 3 个迭代以稳定性能
        active=2,    # 实际分析 2 个迭代
        repeat=1,    # 重复此分析调度 1 次
    ),
    on_trace_ready=torch.profiler.tensorboard_trace_handler('.'),

) as p:
    for iter in range(10):
        pytorch_layer_norm(a)
        p.step()

# 印出分析结果表格，依 CUDA 总时间排序，只列出前几笔
print(p.key_averages().table(sort_by="cuda_time_total", row_limit=8))
```

这会印出依 CUDA 总时间排序的汇总分析结果，输出如下：

![依 CUDA 总时间排序的 PyTorch profiler 汇总结果](../webapp/assets/images/a1_kernels.png)

你也可以如前文所述，在 `chrome://tracing/` 查看 trace（运行轨迹记录）。

> 💡 **提示**：首次使用该工具时，可以用左右方向键在 trace 中移动；按住 **Alt** 键并滚动鼠标滚轮，可以缩放视图。

放大之后，你可以在这份 trace 中观察调用 `layer_norm` 时的操作流程：

![layer_norm 调用在 trace 中的操作流程](../webapp/assets/images/a1_profile_trace.png)

整个序列从 CPU 端（上半部）开始，先是 `aten::layer_norm`，接着进入 `aten::native_layer_norm`，然后转移到 `cudaLaunchKernel`。再往下就进到 GPU 端，调用 `vectorized_layer_norm_kernel` 这个 kernel。

> 📝 **注**：在 profiler 中把 `profile_memory` 设为 `True` 即可启用内存分析。不过，这可能会让 trace 变得更复杂。

PyTorch profiler 能快速提供性能概览，而 **NVIDIA Nsight Compute（`ncu`）** 则能更深入洞察 GPU 性能，包括每个 kernel 的详细运行时间与内存使用量。运行这个 profiler 非常简单：

```bash
ncu --set full python layer_norm.py
```

其中，`layer_norm.py` 是一个只运行层归一化函数的文件。该命令会生成日志；如果想更直观地查看结果，可以添加输出参数：

```bash
ncu --set full -o output python layer_norm.py
```

随后使用 Nsight Compute 打开 `output.ncu-rep` 文件。界面会显示关于计算和内存利用率的明确警告，并给出如何平衡计算与内存、提高占用率（occupancy）的建议：

![Nsight Compute 的分析界面](../webapp/assets/images/a1_ncu.png)

## C++ 扩展（CPP extension）

如果要分析的内核尚未集成到 PyTorch 中，可以使用 PyTorch 的 `cpp_extension` 模块编译并运行自定义 CUDA 代码。只需将 CUDA 内核写入 `.cu` 文件，再通过 `cpp_extension` 的 `load` 函数在 Python 中加载即可。

以一个简单的 `add` kernel 为例，`.cu` 文件会长这样：

```cpp
#include <torch/extension.h>
#include <cuda.h>
#include <cuda_runtime.h>

__global__ void add_kernel(float* x, float* y, float* output, int size) {
    int index = blockIdx.x * blockDim.x + threadIdx.x;
    if (index < size) {
        output[index] = x[index] + y[index];
    }
}

void add_cuda(torch::Tensor x, torch::Tensor y, torch::Tensor output) {
    int threads = 1024;
    int blocks = (x.size(0) + threads - 1) / threads;

    add_kernel<<<blocks, threads>>>(x.data_ptr<float>(), y.data_ptr<float>(), output.data_ptr<float>(), x.size(0));
}

PYBIND11_MODULE(TORCH_EXTENSION_NAME, m) {
    m.def("add_cuda", &add_cuda, "Vector addition (CUDA)");
}
```

以及用来加载这个 kernel 的 Python 文件：

```python
import torch
from torch.utils.cpp_extension import load

# 加载并编译 CUDA 扩展模块
vector_add = load(
    name="vector_add",
    sources=["add_kernel.cu"],
    verbose=True
)

# 定义输入张量
size = 10000
x = torch.randn(size, device='cuda')
y = torch.randn(size, device='cuda')
output = torch.empty(size, device='cuda')

# 运行 CUDA kernel
vector_add.add_cuda(x, y, output)
```

通过这种方法，你就可以像先前示范的那样，使用 PyTorch 的 profiler 或 NVIDIA 的工具来分析这个自定义 CUDA kernel。
