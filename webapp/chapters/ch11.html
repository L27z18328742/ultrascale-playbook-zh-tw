# 结语与展望（Conclusion）

> 译自 Hugging Face nanotron 团队《The Ultra-Scale Playbook: Training LLMs on GPU Clusters》（Apache 2.0），原文为 [Hugging Face Space](https://huggingface.co/spaces/nanotron/ultrascale-playbook)。

恭喜你读到最后！我们从单张 GPU 上的基础训练讲起，逐步介绍了如何在数千张 GPU 上高效训练 Llama-405B、DeepSeek-V3 等大语言模型。现在，你应该已经能够比较轻松地读懂 Llama-3 的 4D 并行配置图：

![Llama-3 的 4D 并行化配置](../webapp/assets/images/conclusion_llama3_parallelism.png)
*Llama-3 的 4D 并行化（4D parallelism）配置示意图。*

协调大规模 GPU 集群高效训练 LLM 并不容易。本书介绍了如何优化 GPU 之间的计算与通信，尽量提高硬件使用率：根据模型和集群规模选择合适的并行策略，尽可能重叠通信与计算，并针对硬件结构编写自定义内核，让关键计算在 GPU 上高效执行。

这些知识过去或许只与少数从事 LLM 预训练的人有关，但如今情况已经不同。随着 [AI 开发者社区](https://huggingface.co)和模型规模快速增长，分布式技术越来越多地用于推理、微调和训练，相关环境也日益普及。现在正是深入学习分布式系统的好时机。

这段学习过程对作者同样漫长。在 GPU 集群上运行数千次基准测试，比预期更具挑战性，也带来了许多值得分享的经验。

## 那么，接下来呢？（So, what's next?）

现在，你已经对分布式训练的主要概念有了整体认识，但书中对许多工具和技术只做了入门介绍。要继续深入，可以从以下几方面入手：

* 阅读具有里程碑意义的经典论文和最新研究。“参考文献”（References）中列出了重要论文、博客文章和书籍。
* 从零开始亲手实现一个算法。实际实现往往能帮助你真正理解方法的细节。
* 参与常用框架的开发，例如修复 bug、回复 issue 或实现新功能。这是深入机器学习工程实践的有效方式。

希望本书能帮助你进入分布式训练领域，并在未来训练出更出色的下一代模型。
